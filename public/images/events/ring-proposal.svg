<svg xmlns="http://www.w3.org/2000/svg" viewBox="10 92 380 280">
  <defs>
    <linearGradient id="lehenga" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a77cc6"/>
      <stop offset="1" stop-color="#7d4fa3"/>
    </linearGradient>
    <linearGradient id="sherwani" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6efe0"/>
      <stop offset="1" stop-color="#e2d5bb"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbe7a9"/>
      <stop offset="0.5" stop-color="#d9b46a"/>
      <stop offset="1" stop-color="#b8862f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff6d8" stop-opacity="1"/>
      <stop offset="1" stop-color="#fff6d8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- floor shadow -->
  <ellipse cx="205" cy="362" rx="150" ry="12" fill="#5a3a7a" opacity="0.12"/>

  <!-- ===== Bride (standing, right) ===== -->
  <g>
    <!-- dupatta trailing behind -->
    <path d="M 262 112 C 300 120 318 170 330 250 C 338 300 340 335 344 356 L 318 356 C 312 300 300 230 284 170 Z" fill="#c9a6e0" opacity="0.75"/>
    <!-- lehenga -->
    <path d="M 250 214 L 292 214 C 310 260 328 310 340 356 L 206 356 C 218 310 234 262 250 214 Z" fill="url(#lehenga)"/>
    <!-- lehenga gold border + motifs -->
    <path d="M 206 356 L 340 356 L 337 344 L 209 344 Z" fill="url(#gold)"/>
    <path d="M 216 322 L 332 322" stroke="#f3dc9a" stroke-width="2" stroke-dasharray="2 7" stroke-linecap="round"/>
    <path d="M 226 288 L 322 288" stroke="#f3dc9a" stroke-width="2" stroke-dasharray="2 8" stroke-linecap="round" opacity="0.8"/>
    <path d="M 238 254 L 306 254" stroke="#f3dc9a" stroke-width="2" stroke-dasharray="2 8" stroke-linecap="round" opacity="0.6"/>
    <!-- waist band -->
    <rect x="248" y="208" width="46" height="9" rx="3" fill="url(#gold)"/>
    <!-- blouse / torso -->
    <path d="M 254 150 C 262 146 282 146 290 150 L 294 210 L 248 210 Z" fill="#b48ad0"/>
    <!-- neck -->
    <rect x="266" y="138" width="11" height="12" rx="4" fill="#efc29d"/>
    <!-- necklace -->
    <path d="M 262 150 Q 271 162 282 150" fill="none" stroke="url(#gold)" stroke-width="3"/>
    <!-- left arm (hand to heart, surprised) -->
    <path d="M 256 156 C 246 172 246 188 258 192 L 268 186" fill="none" stroke="#b48ad0" stroke-width="10" stroke-linecap="round"/>
    <circle cx="270" cy="185" r="6" fill="#efc29d"/>
    <!-- right arm reaching gently toward him -->
    <path d="M 289 156 C 296 176 290 196 280 206" fill="none" stroke="#b48ad0" stroke-width="10" stroke-linecap="round"/>
    <!-- bangles -->
    <path d="M 263 189 l 6 -6" stroke="url(#gold)" stroke-width="3"/>
    <!-- head (faceless) -->
    <circle cx="271" cy="122" r="17" fill="#efc29d"/>
    <!-- hair + bun -->
    <path d="M 254 121 C 254 101 288 99 289 120 C 284 110 262 108 254 121 Z" fill="#3a2420"/>
    <circle cx="289" cy="128" r="8" fill="#3a2420"/>
    <!-- maang tikka -->
    <circle cx="271" cy="106" r="2.6" fill="#d9b46a"/>
    <!-- dupatta over head -->
    <path d="M 250 124 C 250 96 292 92 294 122 C 296 136 292 150 286 158 C 290 140 288 112 271 108 C 256 108 252 118 250 132 Z" fill="#c9a6e0" opacity="0.8"/>
    <!-- earring -->
    <circle cx="257" cy="131" r="2.5" fill="#d9b46a"/>
  </g>

  <!-- ===== Groom (on one knee, left) ===== -->
  <g>
    <!-- back leg: knee on the floor -->
    <path d="M 128 282 L 112 346 L 70 350" fill="none" stroke="#efe6d3" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- back mojari -->
    <path d="M 58 344 Q 66 356 82 354 L 82 346 Z" fill="#7d4fa3"/>
    <!-- front leg: thigh forward, shin down -->
    <path d="M 140 278 L 186 280 L 188 344" fill="none" stroke="#efe6d3" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- front mojari -->
    <path d="M 178 350 Q 196 360 210 354 L 200 344 L 180 344 Z" fill="#7d4fa3"/>

    <!-- sherwani body -->
    <path d="M 112 196 C 122 188 146 188 154 196 L 162 288 C 146 294 118 294 104 288 Z" fill="url(#sherwani)"/>
    <!-- sherwani placket + buttons -->
    <path d="M 133 196 L 135 288" stroke="#d2c19e" stroke-width="2"/>
    <circle cx="133.5" cy="212" r="2.2" fill="#d9b46a"/>
    <circle cx="134" cy="230" r="2.2" fill="#d9b46a"/>
    <circle cx="134.4" cy="248" r="2.2" fill="#d9b46a"/>
    <circle cx="134.8" cy="266" r="2.2" fill="#d9b46a"/>
    <!-- purple stole over shoulder -->
    <path d="M 114 198 C 120 230 116 262 108 300 L 96 300 C 104 262 106 230 104 204 Z" fill="#7d4fa3"/>
    <path d="M 96 300 L 108 300 L 106 306 L 98 306 Z" fill="url(#gold)"/>

    <!-- arm reaching out with the ring box -->
    <path d="M 148 204 C 168 214 184 214 204 208" fill="none" stroke="url(#sherwani)" stroke-width="13" stroke-linecap="round"/>
    <path d="M 148 204 C 168 214 184 214 204 208" fill="none" stroke="#d2c19e" stroke-width="1" opacity="0.6"/>
    <circle cx="208" cy="207" r="6.5" fill="#e6b48e"/>

    <!-- ring box (open) -->
    <rect x="203" y="196" width="22" height="13" rx="2.5" fill="#8b1e3f"/>
    <path d="M 203 196 L 207 182 L 229 182 L 225 196 Z" fill="#a3274f"/>
    <rect x="206" y="198" width="16" height="6" rx="2" fill="#f4e4ea"/>
    <!-- ring with diamond + sparkle -->
    <circle cx="214" cy="196" r="9" fill="url(#glow)"/>
    <circle cx="214" cy="198" r="4.5" fill="none" stroke="url(#gold)" stroke-width="2.2"/>
    <path d="M 210.5 192 L 214 187.5 L 217.5 192 L 214 195 Z" fill="#ffffff" stroke="#a98fd6" stroke-width="0.8"/>
    <path d="M 226 176 l 2 5 l 5 2 l -5 2 l -2 5 l -2 -5 l -5 -2 l 5 -2 z" fill="#f3dc9a"/>

    <!-- neck -->
    <rect x="127" y="178" width="12" height="12" rx="4" fill="#e6b48e"/>
    <!-- head (faceless) -->
    <circle cx="134" cy="163" r="16" fill="#e6b48e"/>
    <!-- beard hint -->
    <path d="M 120 168 C 124 182 144 182 148 168 C 144 174 124 174 120 168 Z" fill="#3a2420" opacity="0.85"/>
    <!-- safa (turban) -->
    <path d="M 116 158 C 114 136 154 134 152 158 C 146 150 122 150 116 158 Z" fill="#7d4fa3"/>
    <path d="M 118 152 C 128 144 142 144 150 152" fill="none" stroke="url(#gold)" stroke-width="2.4"/>
    <path d="M 150 148 C 160 150 164 162 160 176 C 158 166 154 158 148 156 Z" fill="#7d4fa3"/>
    <!-- kalgi -->
    <path d="M 138 138 C 140 128 146 124 150 126 C 146 130 144 134 142 140 Z" fill="url(#gold)"/>
    <circle cx="139" cy="141" r="2.6" fill="#d9b46a"/>
  </g>

  <!-- floating hearts + sparkles -->
  <g fill="#c9a6e0">
    <path d="M 236 150 c -4 -6 -12 -2 -9 4 c 2 4 9 8 9 8 c 0 0 7 -4 9 -8 c 3 -6 -5 -10 -9 -4 z"/>
    <path d="M 214 128 c -3 -4 -8 -1.5 -6 2.5 c 1.5 2.8 6 5.5 6 5.5 c 0 0 4.5 -2.7 6 -5.5 c 2 -4 -3 -6.5 -6 -2.5 z" opacity="0.8"/>
  </g>
  <g fill="#d9b46a">
    <path d="M 196 100 l 3 8 l 8 3 l -8 3 l -3 8 l -3 -8 l -8 -3 l 8 -3 z"/>
    <path d="M 340 120 l 2.5 6 l 6 2.5 l -6 2.5 l -2.5 6 l -2.5 -6 l -6 -2.5 l 6 -2.5 z" opacity="0.7"/>
    <path d="M 60 230 l 2.5 6 l 6 2.5 l -6 2.5 l -2.5 6 l -2.5 -6 l -6 -2.5 l 6 -2.5 z" opacity="0.6"/>
  </g>

  <!-- flowers at the floor corners -->
  <g>
    <circle cx="30" cy="352" r="10" fill="#e8a7c0"/>
    <circle cx="48" cy="358" r="8" fill="#f3dc9a"/>
    <circle cx="18" cy="362" r="7" fill="#c9a6e0"/>
    <circle cx="370" cy="352" r="10" fill="#e8a7c0"/>
    <circle cx="352" cy="360" r="7" fill="#f3dc9a"/>
    <circle cx="384" cy="362" r="7" fill="#c9a6e0"/>
    <path d="M 22 344 q 8 -10 18 -6 M 362 344 q 8 -10 18 -4" stroke="#7fa36b" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>
</svg>
