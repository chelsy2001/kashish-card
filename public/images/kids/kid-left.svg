<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 380"><defs>
<linearGradient id="avelvet" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3a3342"/><stop offset=".45" stop-color="#1c1822"/><stop offset="1" stop-color="#2a2431"/></linearGradient>
<linearGradient id="askin" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f0bf9b"/><stop offset="1" stop-color="#dba07c"/></linearGradient>
<linearGradient id="atrouser" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#121016"/><stop offset=".5" stop-color="#26222c"/><stop offset="1" stop-color="#121016"/></linearGradient>
<radialGradient id="ashine" cx=".35" cy=".3" r=".7"><stop offset="0" stop-color="#ffffff" stop-opacity=".22"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></radialGradient>
<pattern id="ahex" width="16" height="14" patternUnits="userSpaceOnUse"><path d="M4 0 H12 L16 7 L12 14 H4 L0 7Z" fill="none" stroke="#5a5068" stroke-width="1.1"/></pattern></defs><style>
.body{animation:bob 0.48s ease-in-out infinite alternate}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-9px)}}
.armL,.armR,.head{transform-box:view-box}
.armL{animation:armL 0.48s ease-in-out infinite alternate}
.armR{animation:armR 0.48s ease-in-out infinite alternate}
@keyframes armL{from{transform:rotate(-10deg)}to{transform:rotate(12deg)}}
@keyframes armR{from{transform:rotate(-12deg)}to{transform:rotate(10deg)}}
.head{animation:tilt 0.96s ease-in-out infinite alternate}
@keyframes tilt{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}
.eyes{transform-box:fill-box;transform-origin:50% 50%;animation:blink 4.2s infinite}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.tw{animation:tw 1.8s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.15}50%{opacity:1}}
.shadow{transform-box:fill-box;transform-origin:50% 50%;animation:shadow 0.48s ease-in-out infinite alternate}
@keyframes shadow{from{transform:scaleX(1)}to{transform:scaleX(.86)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
