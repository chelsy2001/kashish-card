<pattern id="bhex" width="16" height="14" patternUnits="userSpaceOnUse"><path d="M4 0 H12 L16 7 L12 14 H4 L0 7Z" fill="none" stroke="#5a5068" stroke-width="1.1"/></pattern></defs><style>
.body{animation:bob 0.42s ease-in-out infinite alternate}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-9px)}}
.armL,.armR,.head{transform-box:view-box}
.armL{animation:armL 0.42s ease-in-out infinite alternate}
.armR{animation:armR 0.42s ease-in-out infinite alternate}
@keyframes armL{from{transform:rotate(-10deg)}to{transform:rotate(12deg)}}
@keyframes armR{from{transform:rotate(-12deg)}to{transform:rotate(10deg)}}
.head{animation:tilt 0.84s ease-in-out infinite alternate}
@keyframes tilt{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}
.eyes{transform-box:fill-box;transform-origin:50% 50%;animation:blink 4.2s infinite}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.tw{animation:tw 1.8s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.15}50%{opacity:1}}
.shadow{transform-box:fill-box;transform-origin:50% 50%;animation:shadow 0.42s ease-in-out infinite alternate}
@keyframes shadow{from{transform:scaleX(1)}to{transform:scaleX(.86)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
