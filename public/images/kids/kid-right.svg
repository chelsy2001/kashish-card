<linearGradient id="bskin" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f0bf9b"/><stop offset="1" stop-color="#dba07c"/></linearGradient>
<linearGradient id="btrouser" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#121016"/><stop offset=".5" stop-color="#26222c"/><stop offset="1" stop-color="#121016"/></linearGradient>
